<div class="breadcrumbs">
  <div class="breadcrumbs__path">
    <span class="breadcrumbs__item" >База</span>
    <span class="breadcrumbs__divider">/</span>
    <span class="breadcrumbs__item" >Ячейки</span>
    <span class="breadcrumbs__divider">/</span>
    <span class="breadcrumbs__current">{{titleTab}}</span>
  </div>
</div>

<div class="tab-menu-container">
  <nav class="tab-menu">
    <button class="menu-tab" (click)="switchComponent('arrival', 2, 'invoices', null, 'Приход')"
      [class.active]="titleTab === 'Приход'">
      <span>Приход</span>
      <div class="tab-indicator"></div>
    </button>

    <button class="menu-tab" (click)="switchComponent('expense', 3, 'invoices', null, 'Расход')"
      [class.active]="titleTab === 'Расход'">
      <span>Расход</span>
      <div class="tab-indicator"></div>
    </button>

    <button class="menu-tab" (click)="switchComponent('expense', 1, 'products', '184623', 'Остатки')"
      [class.active]="titleTab === 'Остатки'">
      <span>Остатки</span>
      <div class="tab-indicator"></div>
    </button>

    <button class="menu-tab" (click)="switchComponent('expense', 1, 'products', '936564', 'Поставщики')"
      [class.active]="titleTab === 'Поставщики'">
      <span>Поставщики</span>
      <div class="tab-indicator"></div>
    </button>
  </nav>
</div>


<ng-container *ngIf="typeComponent == 'invoices'">
  <app-invoices [counterpartyId]="'00000000-0000-0000-0000-000000000000'" [columns]="currentColumns"
    [paymentType]="paymentType" [buttonConfigs]="getButtonConfigs()" [totalInfoColumn]="currentTotalInfo"
    [generalForm]="true" [endpoint]="'api/CommercialWork/ManagerDocument'"
    [endpointGetData]="'api/CommercialWork/ManagerDocument/Filter'" [defaultFilter]="defaultFilters"
    [modelForm]="currentFormField" [heightContainer]="'260px'">
  </app-invoices>
</ng-container>
<ng-container *ngIf="typeComponent == 'products'">
  <app-additional-data [config]="productsConf">
  </app-additional-data>
</ng-container>
