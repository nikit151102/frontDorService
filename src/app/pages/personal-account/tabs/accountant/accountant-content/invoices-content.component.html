<div class="dashboard-container">
    <div class="dashboard-header">
        <div class="title-section">
            <h2 class="dashboard-title">Бухгалтер</h2>

        </div>

        <div class="financial-cards">
            <div class="financial-card" *ngIf="invoicesService.totalInfo?.totalCount">
                <div class="card-value count">{{invoicesService.totalInfo.totalCount}}</div>
                <div class="card-label">Записей</div>
            </div>

            <div class="financial-card" *ngIf="invoicesService.totalInfo?.totalIncomeSum">
                <div class="card-value income">{{invoicesService.totalInfo.totalIncomeSum | number:'1.2-2'}}</div>
                <div class="card-label">Приход</div>
            </div>

            <div class="financial-card" *ngIf="invoicesService.totalInfo?.totalExpenseSum">
                <div class="card-value expense">{{invoicesService.totalInfo.totalExpenseSum | number:'1.2-2'}}</div>
                <div class="card-label">Расход</div>
            </div>

            <div class="financial-card" *ngIf="counterpartyData?.partnerSaldoData?.totalSaldo">
                <div class="card-value" [ngClass]="{
                    'negative': counterpartyData.partnerSaldoData.totalSaldo < 0,
                    'positive': counterpartyData.partnerSaldoData.totalSaldo >= 0
                }">
                    {{counterpartyData.partnerSaldoData.totalSaldo | number:'1.2-2'}}
                </div>
                <div class="card-label">Сальдо</div>
            </div>
        </div>
    </div>
</div>


<app-invoices [counterpartyId]="counterpartyId" [counterpartyData]="counterpartyData" [columns]="columnsInvoices"
    [buttonConfigs]="getButtonConfigs()" [totalInfoColumn]="totalInfoColumnInvoices"
    [endpoint]="'api/CommercialWork/DocInvoice'"
    [modelForm]="['dateTime','number','productList.name','productList.quantity','productList.amount','productList.sumAmount','productList.measurementUnit', 'productList.productTarget', 'status']"
    [heightContainer]="'300px'"></app-invoices>
