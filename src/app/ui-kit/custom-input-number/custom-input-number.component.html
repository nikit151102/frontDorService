<div class="custom-input-number" [class.disabled]="disabled">
    <input 
      type="text" 
      [value]="displayValue"
      (input)="handleInput($event)" 
      (keypress)="preventNonNumeric($event)" 
      (blur)="displayValue = getFormattedValue()" 
      [disabled]="disabled"
      [readonly]="disabled" />
</div>
